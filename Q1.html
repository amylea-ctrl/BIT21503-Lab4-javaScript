<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Q1 - Change Paragraph Text on Page Load</title>
</head>
<body>
  <div id="myElement">
    <p>Welcome to my website!</p>
  </div>

  <script>
    // Run the function automatically when the webpage finishes loading
    window.onload = function () {
      document.querySelector("#myElement p").innerHTML = "Hello there!";
    };
  </script>
</body>
</html>
